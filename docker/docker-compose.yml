services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    image: dataask-app:latest
    container_name: dataask-app
    environment:
      # 第一次启动会自动生成 /data/config/.env（含 MASTER_KEY），之后固定不动
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # MCP 网关调用后端用的 key（留空则回落到管理员账号密码登录）
      WC_API_KEY: ${WC_API_KEY:-}
    volumes:
      - dataask-data:/data
    ports:
      - "8000:8000"   # 后端 API（调试用，朋友只需要 8080）
      - "8888:8888"   # Trino UI
      - "9300:9300"   # MCP streamable-http
      - "9301:9301"   # MCP SSE（VSCode / Cline）
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: dataask-web:latest
    container_name: dataask-web
    depends_on:
      - app
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  dataask-data:
