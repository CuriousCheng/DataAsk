server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    # 后端 API（同源，前端 VITE_API_BASE 为空时走这里）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = / {
        return 302 /home/;
    }

    # 七个前端工程（SPA，深链接回落到各自 index.html）
    location /home/ {
        try_files $uri $uri/ /home/index.html;
    }

    location /modeling/ {
        try_files $uri $uri/ /modeling/index.html;
    }

    location /knowledge/ {
        try_files $uri $uri/ /knowledge/index.html;
    }

    location /api-management/ {
        try_files $uri $uri/ /api-management/index.html;
    }

    location /settings/project/ {
        try_files $uri $uri/ /settings/project/index.html;
    }

    location /settings/organization/ {
        try_files $uri $uri/ /settings/organization/index.html;
    }

    location /settings/ {
        try_files $uri $uri/ /settings/index.html;
    }

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
